name: macOS Flutter Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "app"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      build_type:
        description: "macOS app distribution type (unsandbox = 不进沙箱)"
        required: false
        default: "unsandbox"
        type: choice
        options:
          - "unsandbox"
          - "sandbox"
          - "both"
      package:
        description: "macOS app package format"
        required: false
        default: "dmg"
        type: choice
        options:
          - "dmg"
          - "zip"
          - "both"
  workflow_call:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "app"
        type: string
      build_type:
        description: "macOS app distribution type"
        required: false
        default: "both"
        type: string
      package:
        description: "macOS app package format"
        required: false
        default: "both"
        type: string

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      TYPESCRIPT_VERSION: 5.9.3
      EMSDK_VERSION: 3.1.50

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/flutter/app/package-lock.json
            package-lock.json

      # Plugin ToolPkg scripts shell out to a bare `pnpm` (e.g. change_review:
      # "pack:toolpkg": "pnpm run check && node scripts/build.mjs"), while
      # sync_plugin_packages.py invokes it as `corepack pnpm`. Without the shim,
      # the nested call dies with `sh: pnpm: command not found`. Only shim pnpm so
      # the npm steps above keep using the real npm.
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          command -v pnpm
          pnpm --version

      - name: Install repository TypeScript
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-tools/typescript"

          npm install \
            --prefix "$GITHUB_WORKSPACE/.ci-tools/typescript" \
            --no-audit \
            --no-fund \
            "typescript@$TYPESCRIPT_VERSION"

          test -x "$GITHUB_WORKSPACE/.ci-tools/typescript/node_modules/.bin/tsc"

          "$GITHUB_WORKSPACE/.ci-tools/typescript/node_modules/.bin/tsc" --version

          echo "$GITHUB_WORKSPACE/.ci-tools/typescript/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache project Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm
          key: ${{ runner.os }}-fvm-${{ hashFiles('apps/flutter/app/.fvmrc') }}

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/flutter/app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache repository TypeScript
        uses: actions/cache@v4
        with:
          path: .ci-tools/typescript/node_modules
          key: ${{ runner.os }}-typescript-${{ env.TYPESCRIPT_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-typescript-${{ env.TYPESCRIPT_VERSION }}-

      # character_cards/vendor/usearch/build.py compiles USearch to WebAssembly and requires
      # Emscripten. It resolves EMXX first, then `em++` on PATH, then the managed
      # .ci-tools/emsdk/upstream/emscripten/em++.py. Nothing else in the desktop build
      # bootstraps it, so it is installed here and exported through EMXX.
      # Version is pinned: `latest` is Emscripten 7.x, whose libc++ dropped `std::is_pod`
      # and hides `std::uncaught_exceptions` under -fignore-exceptions, which breaks the
      # pinned USearch revision. 3.1.50 still ships both.
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: .ci-tools/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten SDK
        run: |
          if [ ! -x .ci-tools/emsdk/upstream/emscripten/em++ ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
            ./.ci-tools/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          # Always activate: a cache hit restores the SDK but not ~/.emscripten.
          ./.ci-tools/emsdk/emsdk activate "$EMSDK_VERSION"
          test -x .ci-tools/emsdk/upstream/emscripten/em++
          test -x .ci-tools/emsdk/upstream/bin/clang

          # music_studio's build-wasm.mjs shells out to a bare `clang --target=wasm32` plus
          # `wasm-ld`, and the Xcode 16.4 toolchain has no WebAssembly backend
          # ("unable to create target ... triple wasm32"). Route exactly those calls to the
          # emsdk toolchain; every other clang invocation keeps resolving to Apple's.
          shim="$GITHUB_WORKSPACE/.ci-tools/wasm-shim"
          mkdir -p "$shim"
          cat > "$shim/clang" <<'SHIM'
          #!/bin/sh
          self="$(basename "$0")"
          case "$self" in
            clang++) wasm_cc="${WASM_CLANGXX:?WASM_CLANGXX is not set}" ;;
            *)       wasm_cc="${WASM_CLANG:?WASM_CLANG is not set}" ;;
          esac
          for arg in "$@"; do
            case "$arg" in
              --target=wasm32*) exec "$wasm_cc" "$@" ;;
            esac
          done
          exec "/usr/bin/$self" "$@"
          SHIM
          chmod +x "$shim/clang"
          ln -sfn clang "$shim/clang++"

          # emsdk ships its LLVM under upstream/bin. Fall back rather than fail on a layout
          # difference, and drop a clear error when neither source has the linker.
          wasm_clangxx="$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/bin/clang++"
          [ -x "$wasm_clangxx" ] || wasm_clangxx="$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/bin/clang"
          if [ -x "$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/bin/wasm-ld" ]; then
            wasm_ld="$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/bin/wasm-ld"
          elif command -v wasm-ld >/dev/null 2>&1; then
            wasm_ld="$(command -v wasm-ld)"
          else
            echo "::error::emsdk provides no wasm-ld; cannot link the music_studio DSP"
            exit 1
          fi
          ln -sfn "$wasm_ld" "$shim/wasm-ld"
          {
            echo "WASM_CLANG=$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/bin/clang"
            echo "WASM_CLANGXX=$wasm_clangxx"
            echo "WASM_LD=$wasm_ld"
          } >> "$GITHUB_ENV"

          echo "EMSDK=$GITHUB_WORKSPACE/.ci-tools/emsdk" >> "$GITHUB_ENV"
          echo "EMXX=$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/emscripten/em++" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

          # $GITHUB_PATH only appends, so /usr/bin/clang keeps winning over the shim and the
          # bare `clang --target=wasm32` call would still hit Apple's toolchain. Prepending
          # through $GITHUB_ENV is the only way to get the shim resolved first.
          echo "PATH=$shim:$PATH" >> "$GITHUB_ENV"

      - name: Prepare models.dev catalog
        run: python3 tools/build_scripts/models_dev_bundle.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/target
            apps/flutter/native/operit-flutter-bridge/target
            apps/cli/target
            hosts/apple/target
            target/operit-build-tools
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN_VERSION }}-cargo-${{ hashFiles('core/Cargo.lock', 'core/crates/**/Cargo.toml', 'apps/cli/Cargo.lock', 'apps/cli/Cargo.toml', 'apps/cli/src/**', 'hosts/apple/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN_VERSION }}-cargo-

      - name: Generate Dart proxy artifacts
        run: |
          cargo clean --manifest-path core/crates/proxy/local/Cargo.toml -p operit-proxy-local
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          test -f apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart
          test -f apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart

      # .venv/bin/python is created lazily by build_scripts/common.py:prepare_python_command().
      # Mirror that link here so this check exercises the same interpreter the build will use.
      - name: Verify build dependencies
        run: |
          test -x "$GITHUB_WORKSPACE/.ci-tools/typescript/node_modules/.bin/tsc"

          mkdir -p "$GITHUB_WORKSPACE/.venv/bin"
          ln -sfn "$(command -v python3)" "$GITHUB_WORKSPACE/.venv/bin/python"
          test -x "$GITHUB_WORKSPACE/.venv/bin/python"
          "$GITHUB_WORKSPACE/.venv/bin/python" --version

          command -v cargo
          command -v rustup
          command -v fvm
          command -v node
          command -v npm
          command -v pnpm
          test -x "$GITHUB_WORKSPACE/.ci-tools/emsdk/upstream/emscripten/em++"

          # The shim must shadow Apple's clang, otherwise music_studio's bare
          # `clang --target=wasm32` dies 15+ minutes into the build.
          resolved_clang="$(command -v clang)"
          echo "clang -> $resolved_clang"
          echo "wasm-ld -> $(command -v wasm-ld || echo missing)"
          if [ "$resolved_clang" != "$GITHUB_WORKSPACE/.ci-tools/wasm-shim/clang" ]; then
            echo "::error::clang resolves to $resolved_clang instead of the wasm32 shim"
            exit 1
          fi

          # Exercise both shim branches: wasm32 goes to emsdk, native falls back to Apple.
          printf 'int shim_probe(int x){return x + 1;}\n' > /tmp/shim-probe.c
          clang -O0 -c /tmp/shim-probe.c -o /tmp/shim-probe-native.o
          clang --target=wasm32 -O3 -nostdlib -fno-builtin -c /tmp/shim-probe.c -o /tmp/shim-probe.o
          wasm-ld --no-entry --export=shim_probe /tmp/shim-probe.o -o /tmp/shim-probe.wasm
          test -s /tmp/shim-probe.wasm
          echo "wasm32 shim ok: $(wc -c < /tmp/shim-probe.wasm) bytes"

      # The Xcode script phase swallows the compiler's stderr through execFileSync, so a
      # failing USearch compile only surfaces as "ELIFECYCLE Command failed". Building it
      # here keeps em++ output in the job log, and the script is content-addressed, so the
      # later in-build invocation reuses the produced wasm instead of recompiling.
      - name: Prebuild USearch WASM
        run: |
          echo "EMXX=$EMXX"
          "$EMXX" --version
          "$GITHUB_WORKSPACE/.venv/bin/python" plugins/packages/buildin/character_cards/vendor/usearch/build.py

      # git-based pub dependencies occasionally die mid-fetch on the runner
      # ("fatal: early EOF / fetch-pack: invalid index-pack output"). Warming the cache
      # with retries here keeps the build's own pub get from hitting the network again.
      - name: Warm pub dependencies
        if: inputs.products != 'cli'
        run: |
          for attempt in 1 2 3 4; do
            if (cd apps/flutter/app && fvm flutter pub get); then
              echo "pub get ok on attempt $attempt"
              exit 0
            fi
            echo "::warning::pub get attempt $attempt failed, retrying"
            sleep 15
          done
          echo "::error::pub get failed after 4 attempts"
          exit 1

      - name: Build and package macOS app (unsandbox)
        if: inputs.products != 'cli' && (inputs.build_type == 'unsandbox' || inputs.build_type == 'both')
        run: python3 tools/build_scripts/build_flutter_macos.py --type unsandbox

      - name: Build and package macOS app (sandbox)
        if: inputs.products != 'cli' && (inputs.build_type == 'sandbox' || inputs.build_type == 'both')
        run: python3 tools/build_scripts/build_flutter_macos.py --type sandbox

      - name: Build and package macOS CLI
        if: inputs.products != 'app'
        run: python3 tools/build_scripts/build_cli_macos.py --arches all

      # Builds a drag-to-install DMG (app bundle + /Applications symlink) and refuses to
      # publish it unless the signed entitlements match the requested distribution type.
      - name: Package drag-install DMG
        if: inputs.products != 'cli' && inputs.package != 'zip'
        run: |
          set -euo pipefail

          version="$(python3 -c "import tomllib;print(tomllib.load(open('core/crates/runtime/application/Cargo.toml','rb'))['package']['version'])")"
          dist="tools/release/dist"
          types=""
          case "${{ inputs.build_type }}" in
            both) types="unsandbox sandbox" ;;
            *)    types="${{ inputs.build_type }}" ;;
          esac
          if [ -z "$types" ]; then
            types="unsandbox"
          fi
          mkdir -p "$dist"

          for build_type in $types; do
            app="tools/release/work/macos/$build_type/Operit2.app"
            if [ ! -d "$app" ]; then
              echo "::error::missing app bundle: $app"
              exit 1
            fi

            codesign --verify --deep --strict "$app"

            if [ "$build_type" = "sandbox" ]; then want=true; else want=false; fi
            ent_file="$(mktemp)"
            codesign -d --entitlements :- "$app" > "$ent_file" 2>/dev/null || true
            got="$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$ent_file" 2>/dev/null || echo missing)"
            rm -f "$ent_file"
            if [ "$got" != "$want" ]; then
              echo "::error::$app has app-sandbox=$got but build_type=$build_type requires $want"
              exit 1
            fi
            echo "$app: app-sandbox=$got (verified)"

            stage="$(mktemp -d)"
            ditto "$app" "$stage/Operit2.app"
            ln -sfn /Applications "$stage/Applications"

            printf '%s\n' \
              'Operit2 macOS 安装说明' \
              '' \
              '1. 把左侧的 Operit2.app 拖到右侧的 Applications 文件夹。' \
              '2. 首次启动若提示"无法验证开发者"，打开 系统设置 → 隐私与安全性 → 仍要打开。' \
              '3. 或在终端执行：xattr -dr com.apple.quarantine /Applications/Operit2.app' \
              '' \
              '本包为非沙箱版本（app-sandbox = false），可自由读写本地文件。' \
              '未使用 Apple Developer ID 签名，因此未经过公证。' \
              > "$stage/INSTALL.txt"

            dmg="$dist/operit2-app-macos-universal-${build_type}-${version}.dmg"
            rm -f "$dmg"
            hdiutil create -volname "Operit2" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
            codesign --force --sign - "$dmg"
            hdiutil verify "$dmg"

            mount_point="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
            test -d "$mount_point/Operit2.app"
            test -L "$mount_point/Applications"
            codesign --verify --deep --strict "$mount_point/Operit2.app"
            hdiutil detach "$mount_point" > /dev/null 2>&1 || hdiutil detach "$mount_point" -force > /dev/null

            rm -rf "$stage" "$mount_point"

            shasum -a 256 "$dmg" | tee "$dmg.sha256"
            {
              echo "### macOS installer"
              echo ""
              echo "| file | size |"
              echo "| --- | --- |"
              echo "| $(basename "$dmg") | $(du -h "$dmg" | cut -f1) |"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload macOS DMG installer
        if: inputs.products != 'cli' && inputs.package != 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-macos-dmg-${{ github.sha }}
          path: tools/release/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS app artifact
        if: inputs.products != 'cli' && inputs.package != 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-macos-${{ github.sha }}
          path: tools/release/dist/operit2-app-macos-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-macos-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 14
